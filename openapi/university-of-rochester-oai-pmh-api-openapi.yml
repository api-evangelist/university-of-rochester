info:
  title: UR Research Interface Oai Pmh API
  version: '2.0'
  x-generated: '2026-08-30'
  x-method: derived
  x-source: Derived from live probes of https://urresearch.rochester.edu/oai2 on 2026-08-30 (verbs Identify, ListMetadataFormats, ListSets, ListIdentifiers, ListRecords, GetRecord, and a badVerb error case), read against OAI-PMH 2.0. Not published by the University of Rochester; API Evangelist authored this description of their live endpoint.
