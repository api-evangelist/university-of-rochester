  - date: '2026-08-30'
    rating: 3
    summary: >-
      Re-profiled under the API Evangelist university pipeline, which settles operator
      attribution before saving any contract. The June 2026 review's central finding was
      wrong in two ways. First, the eleven catalogued Figshare API entries were not the
      University of Rochester's: the ten OpenAPI documents behind them are titled
      "Figshare altmetric ...", carry contact "Figshare Support", and base on
      https://api.figshare.com/v2 — a generic vendor host fourteen other institutions in
      this cohort also claim. Those specs and everything derived from them have been
      removed; the tenancy is retained as an x-operator tenant entry. Second, the OAI-PMH
      endpoint recorded as "returns valid OAI-PMH response" does not: /oai/request answers
      HTTP 200 with an "Unknown Action" HTML page, a soft 404. The working endpoint is
      /oai2, confirmed here with Identify, ListMetadataFormats, ListSets, ListIdentifiers,
      ListRecords, GetRecord and a badVerb error case. Two genuinely institution-operated
      surfaces are now catalogued — the corrected OAI-PMH interface and a Shibboleth SAML
      2.0 identity provider at idp.rochester.edu, which June recorded as gated and
      non-resolving after guessing the wrong hostname. Library discovery resolved to an
      Ex Libris Primo VE tenancy. No open data portal exists.
    endpoints:
      - url: https://urresearch.rochester.edu/oai2?verb=Identify
        status: 200
        note: >-
          Working OAI-PMH 2.0 endpoint. repositoryName "UR Research", adminEmail
          stephen.alexander@rochester.edu, earliestDatestamp 2003-07-17T19:40:11Z.
          Institution-operated, running IR+ (rochester-rcl/irplus, Apache 2.0).
      - url: https://urresearch.rochester.edu/oai2?verb=ListMetadataFormats
