  name: University of Rochester Shibboleth Identity Provider
  x-operator: institution
  description: >-
    SAML 2.0 / Shibboleth identity provider metadata for the University of Rochester,
    published machine-readably at its own entityID. The EntityDescriptor carries an
    IDPSSODescriptor supporting SAML 1.1 and SAML 2.0 with a shibmd:Scope of
    rochester.edu. Institution-operated by definition — federation identity is not
    something a university can outsource the assertion of — and the single most reliably
    machine-readable surface most institutions run.
