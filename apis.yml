description: >-
  The University of Rochester is a private research university in Rochester, New York,
  and an AAU member, ranked #236 in the QS World University Rankings 2025. It operates
  no central public developer portal and no public API programme, and its programmable
  footprint is small, decentralised, and concentrated in the libraries. Two surfaces are
  genuinely institution-operated and were verified live in August 2026: an OAI-PMH 2.0
  metadata harvesting interface at urresearch.rochester.edu/oai2 for UR Research, the
  legacy institutional repository, which runs on IR+ — repository software the River
  Campus Libraries themselves wrote and released under Apache 2.0 — and a Shibboleth
  SAML 2.0 identity provider at idp.rochester.edu publishing scoped federation metadata
  at its own entityID. Everything else the institution appears to publish is a vendor's
  contract running under its name: the University of Rochester Research Repository (URRR)
  is a Figshare tenancy at rochester.figshare.com and library discovery is an Ex Libris
  Primo VE tenancy at rochester.primo.exlibrisgroup.com. Those tenancies are real
  institutional facts and are recorded as such, but the contracts describing them belong
  to Figshare and Ex Libris, not to Rochester. Administrative systems — the student
  information system, HR, finance, and course/registrar data — are gated behind
  institutional identity and are not publicly documented. The River Campus Libraries
  maintain an active public GitHub organisation (rochester-rcl, 112 repositories) of
  digital-library and preservation tooling, which is the clearest evidence of the
  institution's own engineering output.
