  description: >-
    OAI-PMH 2.0 metadata harvesting interface for UR Research, the University of
    Rochester's legacy institutional repository, served from the university's own domain
    and running IR+ — repository software written and open-sourced under Apache 2.0 by
    the River Campus Libraries. Verified live on 2026-08-30: repositoryName "UR Research",
    earliestDatestamp 2003-07-17T19:40:11Z, three metadata formats (oai_dc, dcterms,
    marc21), hierarchical collection sets, and spec-correct badVerb error handling. This
    is one of the few genuinely institution-engineered API surfaces in this cohort.
