  detail: >-
    Two institution-operated machine-readable surfaces were found and verified live:
    the UR Research OAI-PMH 2.0 endpoint and the Shibboleth/SAML identity provider
    metadata. Beyond those, the University of Rochester publishes no public API and no
    developer portal, and its research repository and library discovery layers are
    vendor tenancies (Figshare, Ex Libris Primo VE) whose contracts are the vendors'.
    The June 2026 profile credited this institution with eleven Figshare API entries
    served from api.figshare.com — a generic vendor host shared by fourteen other
    institutions in this cohort — and the ten refined OpenAPI documents behind them were
    titled "Figshare altmetric ..." with contact "Figshare Support". Those and every
    artifact derived from them have been removed. The previously catalogued OAI-PMH base
    URL urresearch.rochester.edu/oai/request was also wrong: it returns HTTP 200 with an
    "Unknown Action" HTML body — a soft 404. The working endpoint is /oai2, and it is now
    correctly based. rochester.figshare.com answers 202 with an empty body behind a bot
    challenge; it is live, recorded as a tenant surface, and not readable by probe.
