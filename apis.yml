- aid: university-of-rochester:urrr-figshare-tenancy
  name: University of Rochester Research Repository (URRR) — Figshare tenancy
  x-operator: tenant
  description: >-
    URRR is the University of Rochester's current research data repository. It is a
    Figshare tenancy: Rochester's data, Rochester's DOIs, and Rochester's curation, on
    a platform Figshare operates and whose API contract Figshare wrote. The programmatic
    surface is the generic Figshare v2 REST API at api.figshare.com — a host shared by
    fourteen other institutions in this cohort — so the contract is deliberately NOT
    saved here; it belongs to Figshare's own profile. The tenancy itself is a real
    institutional fact and is recorded as one. rochester.figshare.com answers HTTP 202
    with an empty body behind a bot challenge.
  humanURL: https://rochester.figshare.com/
